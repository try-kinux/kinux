name: Creating Rootfs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt update && sudo apt install -y xz-utils

      - run: |
          mkdir -p alpine-root
          
          wget -qO alpine-minirootfs.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64/alpine-minirootfs-3.21.3-x86_64.tar.gz
          sudo tar -xzf alpine-minirootfs.tar.gz -C alpine-root
          rm alpine-minirootfs.tar.gz
          sudo cp /etc/resolv.conf alpine-root/etc/resolv.conf
          sudo cp bux.c alpine-root/tmp/
          
          sudo chroot alpine-root /bin/sh -c "
            apk add curl wpa_supplicant vis tcc
            apk add build-base libarchive-dev curl-dev zstd-dev json-c-dev openssl-dev git make pkgconfig
            apk add skalibs-dev execline-dev s6-dev s6-rc-dev
            
            cd /tmp
            git clone --depth 1 https://git.suckless.org/sbase
            cd sbase && make && make install
            cd /tmp && rm -rf sbase
            
            git clone --depth 1 https://git.suckless.org/ubase
            cd ubase && make && make install
            cd /tmp && rm -rf ubase
            
            wget -qO- https://ftp.gnu.org/gnu/ncurses/ncurses-6.4.tar.gz | tar -xz
            cd ncurses-6.4 && ./configure --prefix=/usr/local --enable-widec --with-shared && make -j\$(nproc) && make install
            cd /tmp && rm -rf ncurses-6.4
            
            wget -qO- https://oils.pub/download/oils-for-unix-0.37.0.tar.gz | tar -xz
            cd oils-for-unix-0.37.0 && ./configure && _build/oils.sh && cp _bin/cxx-opt-sh/oils-for-unix /usr/local/bin/
            cd /tmp && rm -rf oils-for-unix-0.37.0
            
            gcc /tmp/bux.c -o /usr/local/bin/bux -larchive -lcurl -lzstd -lpthread -ljson-c -lssl -lcrypto
            rm /tmp/bux.c
            
            adduser -D -s /usr/local/bin/oils-for-unix kinux
            
            apk del build-base libarchive-dev curl-dev zstd-dev json-c-dev openssl-dev git make pkgconfig skalibs-dev execline-dev s6-dev s6-rc-dev
            apk add skalibs execline s6 s6-rc
            apk del apk-tools busybox
          "
          
          sudo bash -c "cat > alpine-root/etc/os-release << 'KINUXEOF'
          NAME=Kinux
          VERSION=v0
          ID=kinux
          VERSION_ID=15.0
          PRETTY_NAME=\"Kinux\"
          ANSI_COLOR=\"0;35\"
          KINUXEOF"
          
          echo 'export PATH="/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:$PATH"' | sudo tee -a alpine-root/home/kinux/.profile
          echo 'export LD_LIBRARY_PATH="/usr/local/lib:/usr/lib"' | sudo tee -a alpine-root/home/kinux/.profile
          
          sudo bash -c "cat > alpine-root/etc/profile << 'KINUXEOF'
          export PATH=\"/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:\$PATH\"
          export LD_LIBRARY_PATH=\"/usr/local/lib:/usr/lib\"
          KINUXEOF"
          
          cd alpine-root/bin
          sudo ln -sf /usr/local/bin/oils-for-unix sh
          sudo ln -sf /usr/local/bin/oils-for-unix init
          cd "$GITHUB_WORKSPACE"
          
          sudo tar -cJf kinux-rootfs.tar.xz -C alpine-root .
          mkdir -p artifacts
          sudo mv kinux-rootfs.tar.xz artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: kinux-rootfs
          path: artifacts/kinux-rootfs.tar.xz
